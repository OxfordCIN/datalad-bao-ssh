[build-system]
requires = [
    "setuptools >= 59.0.0",
    "wheel",
    ]
build-backend = "setuptools.build_meta"

[project]
name            = "datalad-bao-ssh"
dynamic         = ["version"]
description     = "DataLad extension to set up SSH to use OpenBao signed certificates"
readme          = {file = "README.md", content-type="text/markdown"}
license         = "MIT"
requires-python = ">= 3.10"
dependencies    = [
    "datalad >= 1.2.1",
    "sigstore >= 4.2.0",
    "certifi >= 2026.4.22",
    "truststore",
    "packaging",
    ]
classifiers     = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 4 - Beta"
    ]
authors         = [
    {name = "Duncan Mortimer", email = "duncan.mortimer@ndcn.ox.ac.uk"}
    ]

[project.urls]
"Repository"    = "https://git.fmrib.ox.ac.uk/open-science/datalad/datalad-bao-ssh"
"Documentation" = "https://git.fmrib.ox.ac.uk/open-science/datalad/datalad-bao-ssh"

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov",
  "pytest-httpserver",
  "pytest-mock",
  "trustme",
  "coverage",
  "pexpect",
  "tomli; python_version < \"3.12\""
]

style = [
  "pylint",
  "flake8"
]

[project.entry-points."datalad.extensions"]
bao_setup = "datalad_bao_ssh:command_suite"

[tool.setuptools.packages.find]
include = ["datalad_bao_ssh*"]

[tool.setuptools.dynamic]
version = {attr = "datalad_bao_ssh.version.VERSION"}

[tool.coverage.run]
omit    = ["datalad_bao_ssh/tests/*"]

[tool.pytest.ini_options]
testpaths = ["datalad_bao_ssh/tests"]
addopts   = "-v --cov=datalad_bao_ssh --showlocals --import-mode=importlib"
markers   = [
  "noroottest: Need to be executed as non-root user (will fail otherwise)",
  "unixtest:   Only works on *nix systems"]
