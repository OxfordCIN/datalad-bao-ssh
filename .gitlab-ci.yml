default:
  tags:
    - $RUNNER_TAG

stages:
  - test
  - style
  - build
  - deploy


style:
  stage: style
  image: python:3.14
  tags:
    - docker
  script:
    - apt-get -y update
    - pip install flake8
    - pip install .
    - flake8 --max-line-length=120 --exclude=build


.test: &test_template
  stage: test
  tags:
    - docker
  parallel:
    matrix:
     - PYVER: ["3.11", "3.12", "3.13", "3.14", "3.15"]
  image: python:$PYVER
  except:
    - tags


test:
  <<: *test_template
  script:
    - apt-get -y update
    - apt-get -y install zsh jq curl bash
    - pip install ".[test]"
    - export SHELL=/bin/bash
    - python -m pytest

# Build source and wheel distributions
# suitable for uploading to PyPi.
build-pypi-dist:

  stage: build
  image: python:3.14

  tags:
    - docker

  script:
    - set -e
    - pip install --upgrade pip wheel setuptools twine build
    - python -m build
    - twine check dist/*
    - sdist=$(find dist -maxdepth 1 -name "*.tar.gz")
    - wheel=$(find dist -maxdepth 1 -name "*.whl")
    - for target in $sdist $wheel; do
    -   python -m venv test.venv
    -   . test.venv/bin/activate
    -   pip install --upgrade pip setuptools
    -   pip install $target
    -   deactivate
    -   rm -r test.venv
    - done

  artifacts:
    expire_in: 1 day
    paths:
      - dist/*


# Publish built packages to pypi.
# Requires TWINE_USERNAME and
# TWINE_PASSWORD variables containing
# PyPi login credentials.
deploy-pypi-dist:
  stage: deploy
  only:
    - tags
  image: python:3.14
  when:  manual

  tags:
    - docker

  dependencies:
    - build-pypi-dist

  script:
    - set -e
    - pip install wheel setuptools twine
    - twine upload dist/*
